# Builds the toolchain image from sdk/Dockerfile, pushes it to GHCR, then builds
# every example in it so a broken image never goes unnoticed.
name: sdk-image

on:
  push:
    branches: [main]
    paths:
      - sdk/Dockerfile
      - .github/workflows/sdk-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tlsr8232-sdk

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: sdk
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  examples:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build every example
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]'):latest
          for d in examples/*/ reversed/; do
            echo "::group::$d"
            docker run --rm -v "$PWD":/src -w "/src/$d" "$image" make
            echo "::endgroup::"
          done
